<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Registro de usuarios</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:40px;
}

.container{
    width:600px;
    margin:auto;
}

input{
    width:100%;
    padding:8px;
    margin-bottom:10px;
}

button{
    background:#1976d2;
    color:white;
    border:none;
    padding:10px;
    cursor:pointer;
}

.error{
    color:red;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
}

</style>

</head>

<body>

<div class="container">

<h1>Registro de usuarios</h1>

<p th:if="${error}"
   th:text="${error}"
   class="error">
</p>

<form th:action="@{/register}"
      method="post">

<input
       type="text"
       name="name"
       placeholder="Nombre">

<input
       type="email"
       name="email"
       placeholder="Correo electrónico">

<button type="submit">

Registrar usuario

</button>

</form>

<h2>Usuarios registrados</h2>

<table>

<tr>
<th>ID</th>
<th>Nombre</th>
<th>Email</th>
</tr>

<tr th:each="user : ${users}">

<td th:text="${user.id}"></td>

<td th:text="${user.name}"></td>

<td th:text="${user.email}"></td>

</tr>

</table>

</div>

</body>
</html>
